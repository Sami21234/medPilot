{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Case #{{ case.id }}</h1>
  <p><strong>Patient:</strong> {{ case.patient.name }}</p>
  <p><strong>Symptoms:</strong> {{ case.symptoms_submitted | join(', ') }}</p>

  <h2>AI Prediction</h2>
  <p><strong>{{ case.predicted_disease.name }}</strong></p>
  <div class="confidence-bar"><div class="confidence-fill" style="width:{{ (case.confidence_score*100)|round(1) }}%"></div></div>
  <p style="color:var(--muted)">{{ (case.confidence_score*100)|round(1) }}% confidence</p>
</div>

<div class="card">
  <h2>Your Decision</h2>
  <form method="POST" action="/doctor/cases/{{ case.id }}/validate">
    <label><input type="radio" name="decision" value="confirm" checked style="width:auto;display:inline;margin-right:8px">
      Confirm - I agree with the AI's prediction</label>
    <br><br>
    <label><input type="radio" name="decision" value="override" style="width:auto;display:inline;margin-right:8px">
      Override - the correct diagnosis is:</label>
    <select name="override_disease_id">
      {% for d in all_diseases %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}
    </select>
    <label>Notes (optional)</label>
    <textarea name="notes" rows="3" placeholder="Any clinical notes..."></textarea>
    <button class="btn">Submit Decision</button>
  </form>
</div>
{% endblock %}
